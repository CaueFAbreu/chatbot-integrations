name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [chat-engine, integration-gateway/llm-service, integration-gateway/github-service]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Instalar dependências
        working-directory: ${{ matrix.service }}
        run: npm install

      - name: Rodar testes
        working-directory: ${{ matrix.service }}
        run: npm test
